services:
  backend:
    build: .
    container_name: backend
    env_file:
      - .env.stage
    depends_on:
      - db
      - redis
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn core.wsgi:application --bind 0.0.0.0:8000
      "
    volumes:
      - ./core:/app
      - static_volume:/app/static
      - media_volume:/app/media
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3

    expose:
      - "8000"

    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env.stage
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  nginx:
    image: nginx
    container_name: nginx
    depends_on:
      - backend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/home/app/static
      - media_volume:/home/app/media

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - '6379:6379'
    env_file:
      - .env.stage
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--requirepass your_password_here --appendonly yes
    restart: always

  worker:
    build: .
    container_name: worker
    env_file:
      - .env.stage
    depends_on:
      - redis
      - backend
    command: python -m celery -A core worker --loglevel=info
    volumes:
      - ./core:/app
    restart: unless-stopped

  beat:
    build: .
    container_name: beat
    env_file:
      - .env.stage
    depends_on:
      - redis
      - worker
    command: python -m celery -A core beat --loglevel=info
    volumes:
      - ./core:/app
    restart: unless-stopped

  locust:
    image: locustio/locust:latest
    container_name: locust
    env_file:
      - .env.stage
    depends_on:
      - backend
    working_dir: /mnt/locust
    volumes:
      - ./core:/mnt/locust
    ports:
      - "8089:8089"
    command: >
      -f /mnt/locust/locust/locustfile.py
      --host=http://backend:8000


volumes:
  redis-data:
  static_volume:
  media_volume:
  postgres_data: