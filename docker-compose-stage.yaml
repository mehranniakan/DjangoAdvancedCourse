services:
  backend:
    build: .
    container_name: backend
    depends_on:
      - db
      - redis
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn core.wsgi:application --bind 0.0.0.0
      "
    volumes:
      - ./core:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    restart: unless-stopped
    environment:
      SECRET_KEY: test
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,nginx"
      stage: stage
      DB_NAME: django_db
      DB_USER: django_user
      DB_PASSWORD: Mehr@n00137400
      DB_HOST: db
      DB_PORT: "5432"

  db:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    environment:
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: Mehr@n00137400

  nginx:
    image: nginx
    container_name: nginx
    depends_on:
      - backend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    environment:
      REDIS_ARGS: --requirepass your_password_here --appendonly yes
    restart: always

  worker:
    build: .
    container_name: worker
    depends_on:
      - redis
      - backend
    command: python -m celery -A core worker --loglevel=info
    volumes:
      - ./core:/app
    restart: unless-stopped
    environment:
      SECRET_KEY: test
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      stage: stage
      DB_NAME: django_db
      DB_USER: django_user
      DB_PASSWORD: Mehr@n00137400
      DB_HOST: db
      DB_PORT: "5432"

  beat:
    build: .
    container_name: beat
    depends_on:
      - redis
      - worker
    command: python -m celery -A core beat --loglevel=info
    volumes:
      - ./core:/app
    restart: unless-stopped
    environment:
      SECRET_KEY: test
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      stage: stage
      DB_NAME: django_db
      DB_USER: django_user
      DB_PASSWORD: Mehr@n00137400
      DB_HOST: db
      DB_PORT: "5432"

  locust:
    image: locustio/locust:latest
    container_name: locust
    depends_on:
      - backend
    working_dir: /mnt/locust
    volumes:
      - ./core:/mnt/locust
    ports:
      - "8089:8089"
    command: >
      -f /mnt/locust/locust/locustfile.py
      --host=http://backend:8000

volumes:
  redis-data:
  static_volume:
  media_volume:
  postgres_data:
