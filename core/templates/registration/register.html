{% extends 'base.html' %}

{% block title %}
ثبت نام
{% endblock %}

{% block content %}

<div class="card auth-card">

    <h2>ثبت نام</h2>

    <form method="post">

        {% csrf_token %}

        <div class="form-group">

            <label>نام</label>

            {{ form.first_name }}

        </div>

        <div class="form-group">

            <label>نام خانوادگی</label>

            {{ form.last_name }}

        </div>

        <div class="form-group">

            <label>ایمیل</label>

            {{ form.email }}

        </div>

        <div class="form-group">

            <label>تاریخ تولد</label>

            {{ form.birth_date }}

        </div>

        <div class="form-group">

            <label>رمز عبور</label>

            {{ form.password1 }}

        </div>

        <div class="form-group">

            <label>تکرار رمز عبور</label>

            {{ form.password2 }}

        </div>

        <button
                class="btn btn-success"
                type="submit">

            ثبت نام

        </button>

    </form>

    <p class="switch-page">

        قبلاً ثبت نام کرده‌اید؟

        <a href="{% url 'account:login' %}">

            ورود

        </a>

    </p>

</div>

{% endblock %}
