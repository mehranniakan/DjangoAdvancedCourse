<!doctype html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>ویرایش پاسخ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
<main class="w-full max-w-xl">
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <header class="mb-4">
            <h1 class="text-xl font-bold text-slate-800">ویرایش پاسخ</h1>
            <p class="text-sm text-slate-500 mt-1">متن پاسخ را ویرایش کنید و ذخیره بزنید.</p>
        </header>

        <form class="space-y-4" method="post">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">
                    متن کامنت
                </label>

                {{ form.content }}
                {% if form.content.errors %}
                <p class="mt-2 text-sm text-red-600">{{ form.content.errors }}</p>
                {% endif %}
            </div>

            <div class="flex items-center gap-3">
                <button
                        class="inline-flex items-center justify-center rounded-xl bg-emerald-600 px-5 py-2.5
                   text-white font-medium hover:bg-emerald-700 focus:outline-none focus:ring-4 focus:ring-emerald-200"
                        type="submit"
                >
                    ذخیره تغییرات
                </button>

                <a
                        class="inline-flex items-center justify-center rounded-xl border border-slate-300 px-5 py-2.5
                   text-slate-700 hover:bg-slate-50"
                        href="{% url 'blog:blog_main' %}"
                >
                    انصراف
                </a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
