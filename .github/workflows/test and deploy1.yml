name: Django CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    name: Run pytest and flake8
    runs-on: ubuntu-latest


    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Start Docker services
        run: docker compose -f docker-compose-stage.yaml up -d --build

      - name: Show Docker containers status
        run: docker compose ps

      - name: Run pytest and flake8
        run: docker compose exec -T backend sh -c "pytest && flake8 ."

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Docker services
        if: always()
        run: docker compose down -v

  deploy:
    if: ${{ always() && contains(join(needs.*.result, ','), 'success') }}
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Connect and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script:
            cd DjangoAdvancedCourse
            docker compose -f "docker-compose-stage.yaml" stop
            git pull
            docker compose -f "docker-compose-stage.yaml" restart



